<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#245A3C">
<title>maply</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/vendor/maplibre-gl-5.6.0/maplibre-gl.css">
<link rel="stylesheet" href="/vendor/pannellum-2.5.6/pannellum.css">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/app.css">
<script defer src="/vendor/maplibre-gl-5.6.0/maplibre-gl.js"></script>
<script defer src="/vendor/pannellum-2.5.6/pannellum.js"></script>
</head>
<body>
<header class="top">
  <button class="logo" id="logo" aria-label="maply"><b>maply</b><span class="up" id="day"></span></button>
  <div class="timer" id="timer"><span class="up" data-t="until_truth"></span><b id="left">…</b></div>
  <div class="prog" id="prog"><div class="lb" id="lb"></div><div class="foot"><button class="more hidden" id="more" aria-haspopup="dialog"></button><span class="none hidden" id="none" data-t="no_answer"></span><button class="info hidden" id="rulesBtn" aria-expanded="false" aria-controls="rules" data-aria="rules"><i>i</i></button><button class="fold hidden" id="foldBtn" aria-expanded="true" aria-controls="lb"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div><div class="rules hidden" id="rules" role="note"></div><div class="tip" id="tip"></div></div>
</header>

<main class="stage">
  <div id="pano"></div>
  <button class="compass" id="compass" data-aria="aria_north"><svg id="tape"></svg></button>
  <div class="hint up" id="hint"><i data-t="hint_drag"></i><i data-t="hint_pinch"></i></div>
</main>

<div id="map"></div>
<button class="globe-hit" id="globeHit" data-aria="aria_globe"></button>
<div class="call" id="call"><b id="callB"></b><span class="up" id="callS"></span></div>
<div class="act" id="act"><button id="look" data-t="look_more"></button><button id="go" data-t="final"></button></div>
<div class="ov-top" id="ovTop"></div>
<div class="ov-bot" id="ovBot"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer class="credits" id="credits"></footer>

<div class="loader" id="loader"><div>
  <canvas id="loadglobe" aria-hidden="true"></canvas>
  <b class="mark">maply</b>
  <span class="up" id="loadtext"></span>
</div></div>
<!-- The loading screen runs first; MapLibre, Pannellum and the app are deferred, so it turns while they load. -->
<script src="/land.js"></script>
<script src="/loader.js"></script>
<script src="/ready.js"></script>

<!-- The router first: every screen's file registers itself with it, and app.js starts it. -->
<script defer src="/router.js"></script>
<script defer src="/tg.js"></script>
<script defer src="/mapstyle.js"></script>
<script defer src="/pano.js"></script>
<script defer src="/globe.js"></script>
<script defer src="/app.js"></script>
</body>
</html>
