<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex">
<title>maply #{{.Day}}</title>
<link rel="stylesheet" href="/vendor/maplibre-gl-5.6.0/maplibre-gl.css">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/card/assets/card.css">
<script src="/vendor/maplibre-gl-5.6.0/maplibre-gl.js"></script>
<script src="/mapstyle.js"></script>
<script type="application/json" id="card-data">{{.Data}}</script>
<script src="/card/assets/card.js" defer></script>
</head>
<body class="{{.Density}}">
<header class="head">
  <div class="brand"><b>maply</b><span>#{{.Day}}</span></div>
  <div class="place">{{.Place}}</div>
</header>
<div id="map"></div>
<section class="top">
{{- range .Rows}}
  <div class="row"><em>{{.Rank}}</em><i class="av w">{{if .Photo}}<img src="{{.Photo}}" alt="">{{else}}{{.Initial}}{{end}}</i><span class="who">{{.Name}}</span><span class="km">{{.Dist}}</span><b>{{.Points}}</b></div>
{{- else}}
  <p class="none">{{.Nobody}}</p>
{{- end}}
{{- if .More}}
  <p class="more">{{.More}}</p>
{{- end}}
</section>
</body>
</html>
